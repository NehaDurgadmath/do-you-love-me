<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do You Love Me? 💕</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800;900&display=swap');

  :root {
    --pink: #ff8fab;
    --rose: #ffb3c6;
    --lavender: #c8b6e2;
    --peach: #ffd6a5;
    --cream: #fff9f0;
    --sky: #bde0fe;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #ffd6e7 0%, #ffb3c6 25%, #c8b6e2 60%, #bde0fe 100%);
    background-size: 400% 400%;
    animation: bgShift 8s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ── Floating background hearts ── */
  .bg-hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .bh {
    position: absolute;
    font-size: 1.4rem;
    opacity: 0.18;
    animation: floatUp linear infinite;
    user-select: none;
  }
  @keyframes floatUp {
    0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.18; }
    90%  { opacity: 0.18; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  /* ── Sparkles ── */
  .sparkles { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .sp {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: white;
    animation: sparkleAnim ease-in-out infinite;
    opacity: 0;
  }
  @keyframes sparkleAnim {
    0%,100%{opacity:0;transform:scale(0);}
    50%{opacity:0.9;transform:scale(1);}
  }

  /* ── Main card ── */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1.5px solid rgba(255,255,255,0.8);
    border-radius: 32px;
    padding: 36px 36px 36px;
    max-width: 520px;
    width: 93%;
    box-shadow:
      0 8px 32px rgba(255,143,171,0.28),
      0 2px 8px rgba(200,182,226,0.22),
      inset 0 1px 0 rgba(255,255,255,0.9);
    animation: cardFloat 4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes cardFloat {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-10px); }
  }

  /* ── Blush ── */
  .blush {
    position: absolute;
    width: 48px; height: 20px;
    background: rgba(255,143,171,0.22);
    border-radius: 50%;
    top: 28px;
    filter: blur(6px);
  }
  .blush-l { left: 28px; }
  .blush-r { right: 28px; }

  /* ── Deco stars ── */
  .deco-star {
    position: absolute;
    font-size: 1rem;
    opacity: 0.35;
    animation: starFloat 3s ease-in-out infinite;
  }
  @keyframes starFloat { 0%,100%{transform:translateY(0) rotate(0);} 50%{transform:translateY(-8px) rotate(20deg);} }

  /* ── Characters (images) ── */
  .character-wrap {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    height: 160px;
    margin-bottom: 10px;
    gap: 0px;
  }

  .char-boy, .char-girl {
    height: 150px;
    width: auto;
    object-fit: contain;
    transition: all 0.4s ease;
    filter: drop-shadow(0 6px 14px rgba(255,143,171,0.35));
  }

  /* Boy states */
  .char-boy { animation: boyBounce 2s ease-in-out infinite; }
  @keyframes boyBounce { 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-8px) scale(1.03);} }

  .char-boy.shocked   { animation: boyShocked 0.5s ease infinite; }
  .char-boy.annoyed   { animation: boyAnnoyed 0.6s ease infinite; }
  .char-boy.crying    { animation: boyCrying 0.8s ease infinite; }
  .char-boy.broken    { animation: boyBroken 1s ease infinite; }
  .char-boy.drama     { animation: boyDrama 0.4s ease infinite; }
  .char-boy.dancing   { animation: boyDance 0.5s ease infinite; }

  @keyframes boyShocked  { 0%,100%{transform:scale(1) rotate(0);} 25%{transform:scale(1.08) rotate(-5deg);} 75%{transform:scale(1.08) rotate(5deg);} }
  @keyframes boyAnnoyed  { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05) translateY(-4px);} }
  @keyframes boyCrying   { 0%,100%{transform:translateY(0);} 50%{transform:translateY(6px) scale(0.97);} }
  @keyframes boyBroken   { 0%{transform:rotate(0) scale(1);} 30%{transform:rotate(-10deg) scale(0.94);} 70%{transform:rotate(10deg) scale(0.94);} 100%{transform:rotate(0);} }
  @keyframes boyDrama    { 0%{transform:scale(1);} 25%{transform:scale(1.12) rotate(-4deg);} 75%{transform:scale(1.12) rotate(4deg);} 100%{transform:scale(1);} }
  @keyframes boyDance    { 0%{transform:rotate(-8deg) scale(1);} 25%{transform:rotate(8deg) scale(1.08) translateY(-10px);} 50%{transform:rotate(-8deg) scale(1.12) translateY(-14px);} 75%{transform:rotate(8deg) scale(1.08) translateY(-8px);} 100%{transform:rotate(-8deg) scale(1);} }

  /* Girl states */
  .char-girl { animation: girlBounce 2s ease-in-out infinite; animation-delay: 0.3s; }
  @keyframes girlBounce { 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-6px) scale(1.02);} }

  .char-girl.shocked   { animation: girlShocked 0.5s ease infinite; }
  .char-girl.annoyed   { animation: girlAnnoyed 0.6s ease infinite; }
  .char-girl.crying    { animation: girlCrying 0.8s ease infinite; }
  .char-girl.broken    { animation: girlBroken 1s ease infinite; }
  .char-girl.drama     { animation: girlDrama 0.4s ease infinite; }
  .char-girl.dancing   { animation: girlDance 0.5s ease infinite; animation-delay: 0.15s; }

  @keyframes girlShocked { 0%,100%{transform:scale(1) rotate(0);} 25%{transform:scale(1.07) rotate(4deg);} 75%{transform:scale(1.07) rotate(-4deg);} }
  @keyframes girlAnnoyed { 0%,100%{transform:scale(1) rotate(0);} 50%{transform:scale(1.04) rotate(-3deg) translateY(-3px);} }
  @keyframes girlCrying  { 0%,100%{transform:translateY(0) rotate(0);} 50%{transform:translateY(5px) rotate(2deg);} }
  @keyframes girlBroken  { 0%{transform:rotate(0);} 30%{transform:rotate(8deg) scale(0.95);} 70%{transform:rotate(-8deg) scale(0.95);} 100%{transform:rotate(0);} }
  @keyframes girlDrama   { 0%{transform:scale(1) rotate(0);} 25%{transform:scale(1.1) rotate(3deg);} 75%{transform:scale(1.1) rotate(-3deg);} 100%{transform:scale(1);} }
  @keyframes girlDance   { 0%{transform:rotate(6deg) scale(1);} 25%{transform:rotate(-6deg) scale(1.07) translateY(-8px);} 50%{transform:rotate(6deg) scale(1.1) translateY(-12px);} 75%{transform:rotate(-6deg) scale(1.07) translateY(-6px);} 100%{transform:rotate(6deg) scale(1);} }

  /* Filter tints for emotional states */
  .shocked-filter  { filter: drop-shadow(0 0 8px rgba(255,200,0,0.6)) brightness(1.05); }
  .annoyed-filter  { filter: drop-shadow(0 0 8px rgba(255,100,0,0.4)) saturate(1.2); }
  .crying-filter   { filter: drop-shadow(0 0 10px rgba(100,180,255,0.5)) brightness(0.95); }
  .broken-filter   { filter: drop-shadow(0 0 10px rgba(180,0,0,0.4)) saturate(0.8); }
  .drama-filter    { filter: drop-shadow(0 0 12px rgba(255,50,50,0.5)) saturate(1.3); }
  .dance-filter    { filter: drop-shadow(0 0 16px rgba(255,143,171,0.7)) brightness(1.1) saturate(1.2); }

  /* ── Emotion overlay emoji ── */
  .emotion-badge {
    position: absolute;
    font-size: 1.6rem;
    top: 0px;
    left: 50%;
    transform: translateX(-50%);
    animation: badgePop 0.3s cubic-bezier(.36,.07,.19,.97) both;
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  @keyframes badgePop { 0%{opacity:0;transform:translateX(-50%) scale(0.5);} 70%{transform:translateX(-50%) scale(1.15);} 100%{opacity:1;transform:translateX(-50%) scale(1);} }

  /* ── Tears ── */
  .tear-wrap {
    position: absolute;
    bottom: 20px;
    pointer-events: none;
  }
  .tear {
    position: absolute;
    width: 7px; height: 12px;
    background: linear-gradient(180deg, #bde0fe, #80c2f8);
    border-radius: 50% 50% 60% 60%;
    animation: tearDrop 1s ease-in infinite;
    opacity: 0;
  }
  @keyframes tearDrop { 0%{opacity:1;transform:translateY(0);} 100%{opacity:0;transform:translateY(35px);} }

  /* ── Question text ── */
  .question {
    font-family: 'Pacifico', cursive;
    font-size: clamp(1.6rem, 5vw, 2.3rem);
    color: #c2547a;
    margin-bottom: 6px;
    text-shadow: 0 2px 8px rgba(194,84,122,0.18);
    letter-spacing: 0.5px;
  }

  /* ── Message ── */
  .message {
    font-size: clamp(0.9rem, 3vw, 1.05rem);
    color: #9b6fa0;
    font-weight: 700;
    min-height: 32px;
    margin-bottom: 24px;
    animation: msgPop 0.4s cubic-bezier(.36,.07,.19,.97);
    padding: 0 8px;
    line-height: 1.4;
  }
  @keyframes msgPop { 0%{transform:scale(0.85);opacity:0;} 60%{transform:scale(1.05);} 100%{transform:scale(1);opacity:1;} }
  .msg-shake { animation: msgShake 0.5s ease; }
  @keyframes msgShake { 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-6px)} 40%,60%{transform:translateX(6px)} }

  /* ── Button row ── */
  .btn-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    min-height: 74px;
    transition: all 0.4s ease;
  }

  /* ── Buttons ── */
  .btn {
    border: none;
    cursor: pointer;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    transition: transform 0.18s ease, box-shadow 0.18s ease, font-size 0.5s ease, padding 0.5s ease;
    position: relative;
    overflow: hidden;
    white-space: nowrap;
  }
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50px;
    background: rgba(255,255,255,0.25);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .btn:hover::after { opacity: 1; }
  .btn:hover { transform: scale(1.07) translateY(-2px); }
  .btn:active { transform: scale(0.96); }

  .btn-yes {
    background: linear-gradient(135deg, #ff8fab, #ff6b9d);
    color: white;
    font-size: 1.15rem;
    padding: 14px 36px;
    box-shadow: 0 6px 20px rgba(255,107,157,0.45), 0 0 0 0 rgba(255,143,171,0.4);
    animation: yesPulse 2s ease infinite;
  }
  @keyframes yesPulse {
    0%,100% { box-shadow: 0 6px 20px rgba(255,107,157,0.45), 0 0 0 0 rgba(255,143,171,0.4); }
    50%      { box-shadow: 0 6px 28px rgba(255,107,157,0.6), 0 0 0 10px rgba(255,143,171,0); }
  }

  .btn-no {
    background: linear-gradient(135deg, #c8b6e2, #a78cca);
    color: white;
    font-size: 1rem;
    padding: 12px 28px;
    box-shadow: 0 4px 12px rgba(167,140,202,0.35);
  }
  .btn-no.scared { animation: noScared 0.35s ease; }
  @keyframes noScared { 0%{transform:scale(1)} 30%{transform:scale(0.82) rotate(-6deg)} 70%{transform:scale(0.82) rotate(6deg)} 100%{transform:scale(1)} }

  /* ── Final love screen ── */
  .love-screen { display: none; flex-direction: column; align-items: center; gap: 12px; }
  .love-screen.show { display: flex; }
  .love-title {
    font-family: 'Pacifico', cursive;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    color: #c2547a;
    text-shadow: 0 2px 12px rgba(194,84,122,0.25);
    animation: lovePop 0.6s cubic-bezier(.36,.07,.19,.97) both;
  }
  .love-sub {
    font-size: clamp(0.88rem, 3vw, 1rem);
    color: #9b6fa0;
    font-weight: 700;
    animation: lovePop 0.6s 0.2s cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes lovePop { 0%{opacity:0;transform:scale(0.7);} 70%{transform:scale(1.08);} 100%{opacity:1;transform:scale(1);} }

  /* ── Heart explosion ── */
  .heart-burst { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .hb {
    position: absolute;
    font-size: 1.8rem;
    animation: hbFly 1.4s ease-out forwards;
    opacity: 1;
  }
  @keyframes hbFly {
    0%   { transform: translate(0,0) scale(0.3); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; }
  }

  /* ── Glow ring ── */
  .glow-ring {
    position: absolute;
    inset: -18px;
    border-radius: 48px;
    border: 3px solid rgba(255,143,171,0.4);
    animation: glowRing 2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glowRing { 0%,100%{box-shadow:0 0 0 0 rgba(255,143,171,0.4);} 50%{box-shadow:0 0 30px 10px rgba(255,143,171,0.2);} }

  @media (max-width: 420px) {
    .card { padding: 28px 18px 28px; }
    .btn-row { gap: 12px; }
    .char-boy, .char-girl { height: 120px; }
  }
</style>
</head>

    <div class="love-sub">✨ You finally chose the right answer ✨</div>

</div>

<div class="heart-burst" id="heartBurst"></div>

<script>
  /* ═══ State ═══ */
  let noCount = 0;
  const MAX_NO = 5;

  const YES_BASE = 1.15, YES_GROW = 0.22;
  const NO_BASE  = 1.0,  NO_SHRINK = 0.14;
  const YES_PAD_BASE = [14,36], YES_PAD_GROW = [3,8];
  const NO_PAD_BASE  = [12,28], NO_PAD_SHRINK = [2,6];

  const noMessages = [
    "Wrong answer! 😤",
    "Excuse me… what are you doing? 😒",
    "Babe, don't make me cry… choose the right one 🥺",
    "You're breaking my heart… 💔",
    "Okay babe, you have NO option now 😤💢"
  ];

  const emoteBadges = ['','😱','😤','😭','💔','😡'];
  const filterClasses = ['','shocked-filter','annoyed-filter','crying-filter','broken-filter','drama-filter'];
  const boyAnims   = ['','shocked','annoyed','crying','broken','drama'];
  const girlAnims  = ['','shocked','annoyed','crying','broken','drama'];

  /* ═══ Audio ═══ */
  let ctx;
  function getCtx() { if (!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; }

  function playWrong() {
    const c = getCtx();
    [0,0.08].forEach((delay, i) => {
      const osc = c.createOscillator(), gain = c.createGain();
      osc.connect(gain); gain.connect(c.destination);
      osc.type = i===0 ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(i===0?520:300, c.currentTime+delay);
      osc.frequency.exponentialRampToValueAtTime(i===0?240:180, c.currentTime+delay+0.32);
      gain.gain.setValueAtTime(i===0?0.28:0.15, c.currentTime+delay);
      gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime+delay+0.36);
      osc.start(c.currentTime+delay);
      osc.stop(c.currentTime+delay+0.38);
    });
  }

  function playRight() {
    const c = getCtx();
    [523,659,784,1047,1319].forEach((freq,i) => {
      const osc = c.createOscillator(), gain = c.createGain();
      osc.connect(gain); gain.connect(c.destination);
      osc.type = 'sine'; osc.frequency.value = freq;
      const t = c.currentTime + i*0.1;
      gain.gain.setValueAtTime(0,t);
      gain.gain.linearRampToValueAtTime(0.22,t+0.04);
      gain.gain.exponentialRampToValueAtTime(0.001,t+0.35);
      osc.start(t); osc.stop(t+0.38);
    });
    [800,1200,1600].forEach((freq,i) => {
      const osc = c.createOscillator(), gain = c.createGain();
      osc.connect(gain); gain.connect(c.destination);
      osc.type = 'triangle'; osc.frequency.value = freq;
      const t = c.currentTime+0.5+i*0.08;
      gain.gain.setValueAtTime(0.1,t);
      gain.gain.exponentialRampToValueAtTime(0.001,t+0.3);
      osc.start(t); osc.stop(t+0.32);
    });
  }

  function playPop() {
    const c = getCtx();
    const osc = c.createOscillator(), gain = c.createGain();
    osc.connect(gain); gain.connect(c.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, c.currentTime);
    osc.frequency.exponentialRampToValueAtTime(400, c.currentTime+0.08);
    gain.gain.setValueAtTime(0.1, c.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime+0.1);
    osc.start(c.currentTime); osc.stop(c.currentTime+0.12);
  }

  /* ═══ Helpers ═══ */
  function setCharState(index) {
    const boy = document.getElementById('charBoy');
    const girl = document.getElementById('charGirl');
    const badge = document.getElementById('emoteBadge');
    const tearWrap = document.getElementById('tearWrap');

    // Reset classes
    boy.className = 'char-boy';
    girl.className = 'char-girl';

    if (index === 0) {
      badge.style.display = 'none';
      tearWrap.style.display = 'none';
      return;
    }

    // Add animation class
    if (boyAnims[index])  boy.className  = 'char-boy '  + boyAnims[index]  + ' ' + filterClasses[index];
    if (girlAnims[index]) girl.className = 'char-girl ' + girlAnims[index] + ' ' + filterClasses[index];

    // Badge
    badge.style.display = 'block';
    badge.textContent = emoteBadges[index];
    badge.className = 'emotion-badge';
    void badge.offsetWidth;
    badge.className = 'emotion-badge';

    // Tears
    if (index === 3 || index === 4) {
      tearWrap.style.display = 'block';
    } else {
      tearWrap.style.display = 'none';
    }
  }

  /* ═══ Click handlers ═══ */
  function clickYes() {
    playRight();
    showLoveScreen();
  }

  function clickNo() {
    if (noCount >= MAX_NO) return;
    playWrong();
    noCount++;

    // Message shake
    const msg = document.getElementById('message');
    msg.textContent = noMessages[noCount-1];
    msg.classList.remove('msg-shake');
    void msg.offsetWidth;
    msg.classList.add('msg-shake');

    // Character state
    setCharState(noCount);

    // Grow Yes
    const btnYes = document.getElementById('btnYes');
    const ySize = YES_BASE + noCount*YES_GROW;
    const yPT   = YES_PAD_BASE[0] + noCount*YES_PAD_GROW[0];
    const yPH   = YES_PAD_BASE[1] + noCount*YES_PAD_GROW[1];
    btnYes.style.fontSize = ySize+'rem';
    btnYes.style.padding  = yPT+'px '+yPH+'px';

    // Shrink No
    const btnNo = document.getElementById('btnNo');
    const nSize = Math.max(0.6, NO_BASE - noCount*NO_SHRINK);
    const nPT   = Math.max(5, NO_PAD_BASE[0] - noCount*NO_PAD_SHRINK[0]);
    const nPH   = Math.max(12, NO_PAD_BASE[1] - noCount*NO_PAD_SHRINK[1]);
    btnNo.style.fontSize = nSize+'rem';
    btnNo.style.padding  = nPT+'px '+nPH+'px';
    btnNo.style.opacity  = Math.max(0.4, 1-noCount*0.14);
    btnNo.classList.remove('scared');
    void btnNo.offsetWidth;
    btnNo.classList.add('scared');

    // Final state
    if (noCount >= MAX_NO) {
      setTimeout(() => {
        btnNo.style.display = 'none';
        document.getElementById('btnRow').style.justifyContent = 'center';
        btnYes.style.fontSize = '1.8rem';
        btnYes.style.padding  = '22px 60px';
        btnYes.style.boxShadow = '0 8px 40px rgba(255,107,157,0.7), 0 0 0 8px rgba(255,143,171,0.25)';
        msg.textContent = "Okay, now you officially have only one correct answer 😤💕";
      }, 350);
    }
  }

  function showLoveScreen() {
    document.getElementById('gameArea').style.display = 'none';
    const ls = document.getElementById('loveScreen');
    ls.classList.add('show');
    const ring = document.createElement('div');
    ring.className = 'glow-ring';
    document.getElementById('mainCard').appendChild(ring);
    burstHearts();
    document.body.style.background = 'linear-gradient(135deg, #ffb3c6 0%, #ffd6e7 30%, #ffecf5 60%, #ffd6a5 100%)';
  }

  function burstHearts() {
    const container = document.getElementById('heartBurst');
    const hearts = ['💖','💗','💓','💞','💝','✨','⭐','🌟','💫','🌸','🥰','💘'];
    const cx = window.innerWidth/2, cy = window.innerHeight/2;
    for (let i=0; i<42; i++) {
      const el = document.createElement('div');
      el.className = 'hb';
      el.textContent = hearts[Math.floor(Math.random()*hearts.length)];
      const angle = (Math.random()*360)*Math.PI/180;
      const dist  = 80+Math.random()*280;
      el.style.left = cx+'px'; el.style.top = cy+'px';
      el.style.setProperty('--dx', Math.cos(angle)*dist+'px');
      el.style.setProperty('--dy', Math.sin(angle)*dist+'px');
      el.style.animationDelay = Math.random()*0.4+'s';
      el.style.fontSize = (1.2+Math.random()*1.4)+'rem';
      container.appendChild(el);
      setTimeout(() => el.remove(), 2200);
    }
    setTimeout(burstHearts, 1900);
  }

  /* ═══ Background decoration ═══ */
  function createBgHearts() {
    const c = document.getElementById('bgHearts');
    const emojis = ['💕','💗','💓','🌸','✨','💫','⭐'];
    for (let i=0; i<22; i++) {
      const el = document.createElement('div');
      el.className = 'bh';
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      el.style.left = Math.random()*100+'vw';
      el.style.animationDuration = (7+Math.random()*8)+'s';
      el.style.animationDelay    = (Math.random()*8)+'s';
      el.style.fontSize           = (0.9+Math.random()*1.1)+'rem';
      c.appendChild(el);
    }
  }

  function createSparkles() {
    const c = document.getElementById('sparkles');
    const colors = ['#ffb3c6','#c8b6e2','#bde0fe','#ffd6a5','#ffffff'];
    for (let i=0; i<28; i++) {
      const el = document.createElement('div');
      el.className = 'sp';
      el.style.left = Math.random()*100+'vw';
      el.style.top  = Math.random()*100+'vh';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      const sz = (3+Math.random()*5)+'px';
      el.style.width = sz; el.style.height = sz;
      el.style.animationDuration = (2+Math.random()*3)+'s';
      el.style.animationDelay    = (Math.random()*3)+'s';
      c.appendChild(el);
    }
  }

  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('mouseenter', () => { try { playPop(); } catch(e) {} });
  });

  createBgHearts();
  createSparkles();
</script>
</body>
